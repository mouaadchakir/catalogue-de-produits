<div class="card" style="width: 18rem;height: 400px;">
    <img style="height: 150px;width: 100%;" [src]="product().image" class="card-img-top" [alt]="product().title">
    <div class="card-body">
      <h5 class="card-title" >{{ product().title|slice:0:20 }}...</h5>
      <p class="card-text">{{ product().description | slice:0:70 }}...</p>
      <p class="card-text">{{ product().price | currency:'DH' }}</p>
      <a [routerLink]="['/product-details', product().id]" class="btn btn-primary">View Details</a>
    </div>
  </div>
