<div class="table-responsive product-table-wrapper">
  <table class="table table-sm table-bordered align-middle product-table mb-0">
    <thead>
      <tr>
        <th>Aperçu</th>
        <th>ID</th>
        <th>Nom</th>
        <th>Description</th>
        <th>Prix</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (product of productsList; track product.id) {
        <tr>
          <td>
            <img [src]="product.image" [alt]="product.name" style="width: 40px; height: 32px; object-fit: cover;" />
          </td>
          <td>{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.description }}</td>
          <td>{{ formatPrice(product.price) }}</td>
          <td>
            <button class="btn btn-primary btn-sm me-1" (click)="editProduct(product.id)">Editer</button>
            <button class="btn btn-danger btn-sm" (click)="deleteProduct(product.id)">Supprimer</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
